name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: new vulnerabilities in unchanged dependencies

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      POSTGRES_TEST_URL: postgres://sms:sms@localhost:5432/sms_test?sslmode=disable
      REDIS_TEST_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck (known vulnerabilities reachable from our code)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: npm audit (portal, production dependencies)
        working-directory: portal
        run: npm audit --omit=dev --audit-level=high

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [test, portal]
    strategy:
      matrix:
        service: [smpp-server, http-api, admin-api, router, rater, dlr-processor, connector, webhook-dispatcher, ch-writer, alerter, migrate, wallet-resync, soak-report, admin-user, billing-check, smpp-load, smpp-sim, http-sim, devseed]
    steps:
      - uses: actions/checkout@v4
      - run: docker build ${{ matrix.service == 'admin-api' && '--target admin-api' || '' }} --build-arg SERVICE=${{ matrix.service }} -t amaze-sms/${{ matrix.service }}:${{ github.sha }} .
