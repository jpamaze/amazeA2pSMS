# PostgreSQL and Redis on DATA_1:
#   docker compose -f data.yml --env-file .env up -d
# Single instances for the throughput sign-off; production runs the
# replicated layout in deploy/ha/ (docs/phase5-ha.md).
name: amaze-data
services:
  postgres:
    image: postgres:16
    network_mode: host
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sms
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS}
      - -c
      - effective_cache_size=20GB
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=8GB
    volumes: [pgdata:/var/lib/postgresql/data]
    shm_size: 2g
  redis:
    image: redis:7
    network_mode: host
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY}
      - --maxmemory-policy
      - noeviction
      - --io-threads
      - "4"
      - --protected-mode
      - "no"
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
