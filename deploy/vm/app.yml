# Platform services. Run on every app VM (NODE=app-1, app-2, ...):
#   NODE=app-1 docker compose -f app.yml --env-file .env up -d
# One-off initialisation from any app VM (migrations, Kafka topics, seed data):
#   docker compose -f app.yml --env-file .env --profile init run --rm migrate
#   docker compose -f app.yml --env-file .env --profile init run --rm topics
#   docker compose -f app.yml --env-file .env --profile init run --rm seed   # sign-off test data only
# Production first start (instead of seed): create the platform account and
# its first owner, who signs in with this e-mail through Keycloak:
#   docker compose -f app.yml --env-file .env --profile ops run --rm admin-user \
#     -create-platform "Your Company" -email you@example.com -role owner
# Images: `docker compose -f app.yml build` (needs the repo checked out two
# levels up) or pull ${REGISTRY}/<service>:${TAG} from your registry.
name: amaze-app

x-svc: &svc
  network_mode: host
  restart: unless-stopped
  ulimits: { nofile: { soft: 262144, hard: 262144 } }
  environment: &env
    APP_ENV: ${APP_ENV:-staging}  # production in deploy/ha/env.example (devseed refuses it)
    LOG_LEVEL: info
    NODE_ID: ${NODE:-app}
    # The single-node sign-off layout; the HA layout (deploy/ha/env.example)
    # sets POSTGRES_URL, REDIS_* and CLICKHOUSE_URL to its clusters.
    POSTGRES_URL: ${POSTGRES_URL:-postgres://sms:${POSTGRES_PASSWORD}@${DATA_1}:5432/sms?sslmode=disable}
    REDIS_ADDRS: ${REDIS_ADDRS:-${DATA_1}:6379}
    REDIS_SENTINEL_MASTER: ${REDIS_SENTINEL_MASTER:-}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
    KAFKA_BROKERS: ${KAFKA_1}:9092,${KAFKA_2}:9092,${KAFKA_3}:9092
    SECRETS_KEY: ${SECRETS_KEY}
    CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://${CH_1}:8123}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    PPROF: ${PPROF:-false}  # profiling endpoints on the ops port; turn on only while investigating

x-build: &build
  context: ../..

services:
  smpp-server:
    <<: *svc
    image: ${REGISTRY}/smpp-server:${TAG}
    build: { <<: *build, args: { SERVICE: smpp-server } }
    environment:
      <<: *env
      OPS_ADDR: ":9101"
      # Behind the HA load balancers: the client address comes in a PROXY header from them.
      SMPP_PROXY_PROTOCOL_FROM: ${SMPP_PROXY_PROTOCOL_FROM:-}
  http-api:
    <<: *svc
    image: ${REGISTRY}/http-api:${TAG}
    build: { <<: *build, args: { SERVICE: http-api } }
    environment: { <<: *env, OPS_ADDR: ":9102" }
  # Portal and admin API. Needs Keycloak: it does not start without OIDC_ISSUER.
  admin-api:
    <<: *svc
    image: ${REGISTRY}/admin-api:${TAG}
    build: { <<: *build, target: admin-api, args: { SERVICE: admin-api } }
    environment:
      <<: *env
      OPS_ADDR: ":9103"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-amaze-admin,amaze-portal}"
      OIDC_DISCOVERY_URL: "${OIDC_DISCOVERY_URL:-}"
      PORTAL_OIDC_ISSUER: "${PORTAL_OIDC_ISSUER:-}"
      PROMETHEUS_URL: "http://${MON_1}:9090"
  router:
    <<: *svc
    image: ${REGISTRY}/router:${TAG}
    build: { <<: *build, args: { SERVICE: router } }
    environment:
      <<: *env
      OPS_ADDR: ":9104"
      HLR_URL: "${HLR_URL:-}"
      HLR_AUTH_HEADER: "${HLR_AUTH_HEADER:-}"
      HLR_AUTH_VALUE: "${HLR_AUTH_VALUE:-}"
      HLR_MCCMNC_PATH: "${HLR_MCCMNC_PATH:-}"
      HLR_MCC_PATH: "${HLR_MCC_PATH:-}"
      HLR_MNC_PATH: "${HLR_MNC_PATH:-}"
      HLR_STATUS_PATH: "${HLR_STATUS_PATH:-}"
      HLR_STATUS_OK: "${HLR_STATUS_OK:-}"
      HLR_STATUS_ABSENT: "${HLR_STATUS_ABSENT:-}"
      HLR_STATUS_INVALID: "${HLR_STATUS_INVALID:-}"
  rater:
    <<: *svc
    image: ${REGISTRY}/rater:${TAG}
    build: { <<: *build, args: { SERVICE: rater } }
    environment: { <<: *env, OPS_ADDR: ":9105" }
  dlr-processor:
    <<: *svc
    image: ${REGISTRY}/dlr-processor:${TAG}
    build: { <<: *build, args: { SERVICE: dlr-processor } }
    environment: { <<: *env, OPS_ADDR: ":9106" }
  # Every vendor added in the portal (not disabled, with an enabled bind or an
  # HTTP profile) runs here within 30 s, its route topic created on the way;
  # edits to its binds or profile restart it. Every app VM opens every bind:
  # with 3 app VMs, a vendor that allows 6 binds gets 2 bind rows in the portal.
  # HTTP vendors send receipts to /dlr/<vendor> on DLR_ADDR (behind the
  # balancers at https://<DLR_HOST>/dlr/<vendor>).
  connector:
    <<: *svc
    image: ${REGISTRY}/connector:${TAG}
    build: { <<: *build, args: { SERVICE: connector } }
    environment: { <<: *env, OPS_ADDR: ":9107", VENDOR_ID: "*", DLR_ADDR: ":8090", ROUTE_TOPIC_REPLICAS: "3" }
  alerter:
    <<: *svc
    image: ${REGISTRY}/alerter:${TAG}
    build: { <<: *build, args: { SERVICE: alerter } }
    environment:
      <<: *env
      OPS_ADDR: ":9111"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_TLS: "${SMTP_TLS:-starttls}"
      ALERT_SMS_URL: "${ALERT_SMS_URL:-}"
      ALERT_SMS_API_KEY: "${ALERT_SMS_API_KEY:-}"
      ALERT_SMS_SENDER: "${ALERT_SMS_SENDER:-}"
  webhook-dispatcher:
    <<: *svc
    image: ${REGISTRY}/webhook-dispatcher:${TAG}
    build: { <<: *build, args: { SERVICE: webhook-dispatcher } }
    environment: { <<: *env, OPS_ADDR: ":9109" }
  ch-writer:
    <<: *svc
    image: ${REGISTRY}/ch-writer:${TAG}
    build: { <<: *build, args: { SERVICE: ch-writer } }
    environment: { <<: *env, OPS_ADDR: ":9110" }

  # --- one-off initialisation (profile "init") ---
  migrate:
    <<: *svc
    profiles: [init]
    restart: "no"
    image: ${REGISTRY}/migrate:${TAG}
    build: { <<: *build, args: { SERVICE: migrate } }
  topics:
    profiles: [init]
    network_mode: host
    image: redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/bash", "/topics.sh"]
    environment:
      BROKERS: ${KAFKA_1}:9092,${KAFKA_2}:9092,${KAFKA_3}:9092
      REPLICAS: "3"
      PARTITIONS: "24"
      VENDORS: sim httpsim
    volumes: ["../kafka-topics.sh:/topics.sh:ro"]
  seed:
    <<: *svc
    profiles: [init]
    restart: "no"
    image: ${REGISTRY}/devseed:${TAG}
    build: { <<: *build, args: { SERVICE: devseed } }
    command: ["-sim-host", "${SIM_1}", "-sim-binds", "8", "-http-sim-url", "http://${SIM_1}:2777", "-balance", "${SEED_BALANCE:-10000000}", "-tps", "20000"]
  billing-check:
    <<: *svc
    profiles: [init]
    restart: "no"
    image: ${REGISTRY}/billing-check:${TAG}
    build: { <<: *build, args: { SERVICE: billing-check } }
  # After a Redis failover or restore (docs/phase5-ha.md):
  #   docker compose -f app.yml --env-file .env --profile ops run --rm wallet-resync [-dry-run]
  wallet-resync:
    <<: *svc
    profiles: [ops]
    restart: "no"
    image: ${REGISTRY}/wallet-resync:${TAG}
    build: { <<: *build, args: { SERVICE: wallet-resync } }
  # Grants a person sign-in access; -create-platform also creates the
  # platform account on a new installation (see the top of this file).
  admin-user:
    <<: *svc
    profiles: [ops]
    restart: "no"
    image: ${REGISTRY}/admin-user:${TAG}
    build: { <<: *build, args: { SERVICE: admin-user } }
  # Judges a soak test from Prometheus (scripts/signoff.sh soak-report).
  soak-report:
    <<: *svc
    profiles: [ops]
    restart: "no"
    image: ${REGISTRY}/soak-report:${TAG}
    build: { <<: *build, args: { SERVICE: soak-report } }
