# Local development stack. Start with `make up`.
name: amaze-sms

x-service: &service
  build:
    context: ..
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    redpanda: { condition: service_healthy }
  environment: &env
    APP_ENV: dev
    LOG_LEVEL: debug
    POSTGRES_URL: postgres://sms:sms@postgres:5432/sms?sslmode=disable
    REDIS_ADDRS: redis:6379
    KAFKA_BROKERS: redpanda:9092

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start --mode dev-container --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 30

  topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/topics.sh"]
    environment:
      BROKERS: redpanda:9092
      VENDORS: sim
    volumes: ["./kafka-topics.sh:/topics.sh:ro"]
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: sms
      CLICKHOUSE_USER: sms
      CLICKHOUSE_PASSWORD: sms
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - chdata:/var/lib/clickhouse
      - ../migrations/clickhouse:/docker-entrypoint-initdb.d:ro

  migrate:
    <<: *service
    build: { context: .., args: { SERVICE: migrate } }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  smpp-server:
    <<: *service
    build: { context: .., args: { SERVICE: smpp-server } }
    ports: ["2775:2775", "9101:9090"]

  http-api:
    <<: *service
    build: { context: .., args: { SERVICE: http-api } }
    ports: ["8080:8080", "9102:9090"]

  admin-api:
    <<: *service
    build: { context: .., target: admin-api, args: { SERVICE: admin-api } }
    ports: ["8081:8081", "9103:9090"]
    environment:
      <<: *env
      # Tokens are issued for localhost:8180 (what your browser/curl uses);
      # inside Docker, discovery is fetched from the keycloak service.
      OIDC_ISSUER: http://localhost:8180/realms/amaze
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/amaze

  # Dev identity provider. Sign in as ops@amaze.local / dev-only-change-me.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname=http://localhost:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes: ["./keycloak/amaze-realm.json:/opt/keycloak/data/import/amaze-realm.json:ro"]
    ports: ["8180:8080"]

  router:
    <<: *service
    build: { context: .., args: { SERVICE: router } }
    ports: ["9104:9090"]

  rater:
    <<: *service
    build: { context: .., args: { SERVICE: rater } }
    ports: ["9105:9090"]

  dlr-processor:
    <<: *service
    build: { context: .., args: { SERVICE: dlr-processor } }
    ports: ["9106:9090"]

  # Runs every vendor configured in the database (sim and httpsim after seeding).
  connector:
    <<: *service
    build: { context: .., args: { SERVICE: connector } }
    environment:
      <<: *env
      VENDOR_ID: "*"
      VENDOR_RESCAN: 10s
      DLR_ADDR: ":8090"
    ports: ["9107:9090", "8090:8090"]

  alerter:
    <<: *service
    build: { context: .., args: { SERVICE: alerter } }
    environment:
      <<: *env
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      SMTP_FROM: alerts@amaze.local
    ports: ["9111:9090"]

  # Dev mail catcher for alert e-mails: open http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20.5
    ports: ["8025:8025"]

  webhook-dispatcher:
    <<: *service
    build: { context: .., args: { SERVICE: webhook-dispatcher } }
    environment:
      <<: *env
      WEBHOOK_ALLOW_PRIVATE: "true"
    ports: ["9109:9090"]

  ch-writer:
    <<: *service
    build: { context: .., args: { SERVICE: ch-writer } }
    depends_on:
      redpanda: { condition: service_healthy }
      clickhouse: { condition: service_started }
    environment:
      <<: *env
      CLICKHOUSE_URL: http://clickhouse:8123
    ports: ["9110:9090"]

  # Fake HTTP vendor; calls back DLRs to the connector.
  http-sim:
    build: { context: .., args: { SERVICE: http-sim } }
    command: ["-addr", ":2777", "-dlr-url", "http://connector:8090/dlr/httpsim?token=devtoken"]
    ports: ["2777:2777"]

  # Fake vendor SMSC that answers submits and sends delivery receipts.
  smpp-sim:
    build: { context: .., args: { SERVICE: smpp-sim } }
    command: ["-addr", ":2776", "-dlr-delay", "200ms", "-fail", "0.02"]
    ports: ["2776:2776"]

  # Demo account, credentials, rate card, simulator vendor and route.
  # Prints the HTTP API key: docker compose logs seed
  seed:
    <<: *service
    build: { context: .., args: { SERVICE: devseed } }
    command: ["-sim-host", "smpp-sim", "-sim-port", "2776", "-http-sim-url", "http://http-sim:2777"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

volumes:
  pgdata:
  chdata:
