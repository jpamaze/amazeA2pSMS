# PostgreSQL HA on PG_1..PG_3, one node per VM (NODE_NAME=pg-1..3, SELF=its IP):
#   NODE_NAME=pg-1 SELF=$PG_1 docker compose -f postgres.yml --env-file .env up -d
# etcd (the Patroni consensus store) runs on the same three VMs. Mount the
# NFS backup share at BACKUP_NFS_PATH on every node first.
# Before the first start of patroni, turn etcd authentication on (once, on
# PG_1, with etcd running on all three):
#   docker compose -f postgres.yml --env-file .env up -d etcd     # on each PG VM
#   docker compose -f postgres.yml --env-file .env exec etcd sh -c \
#     'etcdctl user add root --new-user-password="$ETCD_ROOT_PASSWORD" &&
#      etcdctl user grant-role root root && etcdctl auth enable'
# Firewall 2379/2380 (etcd) and 8008 (Patroni) to the PG and LB VMs only.
# After the first start, on the leader (patronictl list):
#   docker compose -f postgres.yml --env-file .env exec patroni /etc/amaze/backup.sh init
name: amaze-pg
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    network_mode: host
    restart: unless-stopped
    command:
      - etcd
      - --name=${NODE_NAME}
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${SELF}:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://${SELF}:2380
      - --initial-cluster=pg-1=http://${PG_1}:2380,pg-2=http://${PG_2}:2380,pg-3=http://${PG_3}:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=amaze-pg
    environment:
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD}
      ETCDCTL_API: "3"
    volumes: [etcd:/etcd-data]
  patroni:
    build: ./postgres
    image: ${REGISTRY}/postgres-ha:${TAG}
    network_mode: host
    restart: unless-stopped
    depends_on: [etcd]
    shm_size: 2g
    stop_grace_period: 60s
    environment:
      NODE_NAME: ${NODE_NAME}
      SELF: ${SELF}
      PG_1: ${PG_1}
      PG_2: ${PG_2}
      PG_3: ${PG_3}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      PATRONI_REST_PASSWORD: ${PATRONI_REST_PASSWORD}
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD}
      REPLICATION_PASSWORD: ${PG_REPLICATION_PASSWORD}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS}
      PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PORT: ${S3_PORT:-443}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_URI_STYLE: ${S3_URI_STYLE:-host}
      BACKUP_CIPHER_PASS: ${BACKUP_CIPHER_PASS}
      BACKUP_RETENTION_FULL_S3: ${BACKUP_RETENTION_FULL_S3:-4}
      BACKUP_RETENTION_FULL_NFS: ${BACKUP_RETENTION_FULL_NFS:-2}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${BACKUP_NFS_PATH}:/backup
volumes:
  etcd:
  pgdata:
