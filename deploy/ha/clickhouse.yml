# ClickHouse HA on CH_1..CH_3 (NODE_NAME=ch-1..3, KEEPER_ID=1..3):
#   NODE_NAME=ch-1 KEEPER_ID=1 SELF=$CH_1 docker compose -f clickhouse.yml --env-file .env up -d
# The platform lists all three (CLICKHOUSE_URL=http://CH_1:8123,...) and
# moves to another replica when one is down or read-only.
name: amaze-clickhouse
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    network_mode: host
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: sms
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      NODE_NAME: ${NODE_NAME}
      KEEPER_ID: ${KEEPER_ID}
      SELF: ${SELF}
      CH_1: ${CH_1}
      CH_2: ${CH_2}
      CH_3: ${CH_3}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_URI_STYLE: ${S3_URI_STYLE:-host}
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./clickhouse/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_NFS_PATH}:/backup
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
volumes:
  chdata:
