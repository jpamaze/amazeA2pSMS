# Customer and admin entry points on LB_1/LB_2 behind the keepalived VIP.
# SMPP and HTTP pass through as TCP (TLS is terminated by the services or
# here, as configured); an app VM is taken out when its readiness check
# fails, and existing SMPP binds move by reconnecting.
global
  maxconn 200000
  log stdout format raw local0
defaults
  mode tcp
  log global
  option tcplog
  timeout connect 3s
  timeout client 10m
  timeout server 10m
  default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions

listen stats
  mode http
  bind "${LB_PRIVATE_IP}":7000
  stats enable
  stats uri /
  stats auth admin:"${LB_STATS_PASSWORD}"

# SMPP, plain on 2775 and over TLS on 3550 (terminated here). The client's
# address goes to the SMPP servers in a PROXY header (send-proxy-v2), so
# per-address limits and IP allow lists see the customer, not this balancer;
# the servers accept that header only from LB_1/LB_2
# (SMPP_PROXY_PROTOCOL_FROM).
listen smpp
  bind :2775
  bind :3550 ssl crt /usr/local/etc/haproxy/certs/smpp.pem
  balance leastconn
  option httpchk GET /readyz
  server app-1 "${APP_1}":2775 check port 9101 send-proxy-v2
  server app-2 "${APP_2}":2775 check port 9101 send-proxy-v2
  server app-3 "${APP_3}":2775 check port 9101 send-proxy-v2

listen http-api
  bind :8080
  balance roundrobin
  option httpchk GET /readyz
  server app-1 "${APP_1}":8080 check port 9102
  server app-2 "${APP_2}":8080 check port 9102
  server app-3 "${APP_3}":8080 check port 9102

listen portal-admin
  bind :8081
  balance roundrobin
  option httpchk GET /readyz
  server app-1 "${APP_1}":8081 check port 9103
  server app-2 "${APP_2}":8081 check port 9103
  server app-3 "${APP_3}":8081 check port 9103

# PostgreSQL for operators and tools (the services use a multi-host URL),
# on the private interface only.
listen postgres-primary
  bind "${LB_PRIVATE_IP}":5000
  option httpchk OPTIONS /primary
  http-check expect status 200
  server pg-1 "${PG_1}":5432 check port 8008
  server pg-2 "${PG_2}":5432 check port 8008
  server pg-3 "${PG_3}":5432 check port 8008

listen postgres-replicas
  bind "${LB_PRIVATE_IP}":5001
  balance roundrobin
  option httpchk OPTIONS /replica
  http-check expect status 200
  server pg-1 "${PG_1}":5432 check port 8008
  server pg-2 "${PG_2}":5432 check port 8008
  server pg-3 "${PG_3}":5432 check port 8008
