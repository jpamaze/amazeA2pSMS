# Customer and admin entry points on LB_1/LB_2 behind the keepalived VIP.
# HTTPS (443) is terminated here and sent by host name to the HTTP API
# (API_HOST), vendor receipts (DLR_HOST) or the portal (every other name:
# the main portal domain and resellers' own domains). SMPP passes through as
# TCP, or is decrypted here on 3550. An app VM is taken out when its
# readiness check fails, and existing SMPP binds move by reconnecting.
global
  maxconn 200000
  log stdout format raw local0
defaults
  mode tcp
  log global
  option tcplog
  timeout connect 3s
  timeout client 10m
  timeout server 10m
  default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions

listen stats
  mode http
  bind "${LB_PRIVATE_IP}":7000
  stats enable
  stats uri /
  stats auth admin:"${LB_STATS_PASSWORD}"
  # Metrics for Prometheus (monitoring.yml scrapes LB_1/LB_2 on 7001).
listen prometheus
  mode http
  bind "${LB_PRIVATE_IP}":7001
  http-request use-service prometheus-exporter if { path /metrics }

# SMPP, plain on 2775 and over TLS on 3550 (terminated here). The client's
# address goes to the SMPP servers in a PROXY header (send-proxy-v2), so
# per-address limits and IP allow lists see the customer, not this balancer;
# the servers accept that header only from LB_1/LB_2
# (SMPP_PROXY_PROTOCOL_FROM).
listen smpp
  bind :2775
  bind :3550 ssl crt /usr/local/etc/haproxy/certs/smpp.pem
  balance leastconn
  option httpchk GET /readyz
  server app-1 "${APP_1}":2775 check port 9101 send-proxy-v2
  server app-2 "${APP_2}":2775 check port 9101 send-proxy-v2
  server app-3 "${APP_3}":2775 check port 9101 send-proxy-v2

# HTTPS for the portal, the HTTP API and vendor receipts. certs/https/
# holds one PEM per name (chain followed by key); the certificate is picked
# by the name the client asks for (SNI), so add a reseller's domain by
# dropping its PEM here and reloading. Port 80 only redirects.
frontend https
  mode http
  bind :443 ssl crt /usr/local/etc/haproxy/certs/https/ alpn h2,http/1.1
  bind :80
  option httplog
  timeout http-request 10s
  http-request redirect scheme https code 301 unless { ssl_fc }
  # The client address as seen here, replacing anything the client sent
  # (admin-api records it in the audit log).
  http-request set-header X-Forwarded-For %[src]
  http-request set-header X-Forwarded-Proto https
  acl api_host req.hdr(host),field(1,:) -i "${API_HOST}"
  acl dlr_host req.hdr(host),field(1,:) -i "${DLR_HOST}"
  http-request deny deny_status 404 if dlr_host !{ path_beg /dlr/ }
  use_backend http-api if api_host
  use_backend vendor-dlr if dlr_host
  default_backend portal

backend http-api
  mode http
  balance roundrobin
  option httpchk GET /readyz
  server app-1 "${APP_1}":8080 check port 9102
  server app-2 "${APP_2}":8080 check port 9102
  server app-3 "${APP_3}":8080 check port 9102

backend portal
  mode http
  balance roundrobin
  option httpchk GET /readyz
  server app-1 "${APP_1}":8081 check port 9103
  server app-2 "${APP_2}":8081 check port 9103
  server app-3 "${APP_3}":8081 check port 9103

# HTTP vendors post delivery receipts to https://DLR_HOST/dlr/<vendor>.
backend vendor-dlr
  mode http
  balance roundrobin
  option httpchk GET /readyz
  server app-1 "${APP_1}":8090 check port 9107
  server app-2 "${APP_2}":8090 check port 9107
  server app-3 "${APP_3}":8090 check port 9107

# Plain HTTP API and portal for operators and tools on the private network
# only; customers use HTTPS above.
listen http-api-private
  bind "${LB_PRIVATE_IP}":8080
  balance roundrobin
  option httpchk GET /readyz
  server app-1 "${APP_1}":8080 check port 9102
  server app-2 "${APP_2}":8080 check port 9102
  server app-3 "${APP_3}":8080 check port 9102

listen portal-private
  bind "${LB_PRIVATE_IP}":8081
  balance roundrobin
  option httpchk GET /readyz
  server app-1 "${APP_1}":8081 check port 9103
  server app-2 "${APP_2}":8081 check port 9103
  server app-3 "${APP_3}":8081 check port 9103

# PostgreSQL for operators and tools (the services use a multi-host URL),
# on the private interface only.
listen postgres-primary
  bind "${LB_PRIVATE_IP}":5000
  option httpchk OPTIONS /primary
  http-check expect status 200
  server pg-1 "${PG_1}":5432 check port 8008
  server pg-2 "${PG_2}":5432 check port 8008
  server pg-3 "${PG_3}":5432 check port 8008

listen postgres-replicas
  bind "${LB_PRIVATE_IP}":5001
  balance roundrobin
  option httpchk OPTIONS /replica
  http-check expect status 200
  server pg-1 "${PG_1}":5432 check port 8008
  server pg-2 "${PG_2}":5432 check port 8008
  server pg-3 "${PG_3}":5432 check port 8008
