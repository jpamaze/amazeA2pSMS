openapi: 3.1.0
info:
  title: Amaze A2P SMS - Customer API
  version: 0.1.0
  description: |
    Customer HTTP API. A 202 means the message is durably queued and its cost
    is held against wallet balance + credit limit. Delivery status arrives by
    webhook or GET /v1/sms/{id}.

    Webhooks: when a message reaches a final status, the platform POSTs
    {"event":"message.status","id","status","error_code","to","sender",
    "segments","cost","client_ref","accepted_at","completed_at"} to the
    account's webhook URL with header
    X-Amaze-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">
    keyed by the account's webhook secret. Answer 2xx within 10 s; other
    answers are retried after 30 s, 5 min, 30 min and 2 h. Delivery is
    at-least-once: de-duplicate by id.
servers:
  - url: https://api.example.com
security:
  - apiKey: []
paths:
  /v1/sms:
    post:
      summary: Send one SMS
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 64 }
          description: Same key within 96 h returns the original result instead of sending again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendRequest' }
      responses:
        '202':
          description: Accepted and queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402':
          description: >-
            insufficient_balance: wallet + credit limit - holds < cost.
            reseller_billing: your reseller's wallet does not cover the message, or your reseller has no rate for this destination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: account_inactive (your account or your reseller's account is suspended)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            no_rate: no rate for this destination on the account's rate card.
            dlt_entity, dlt_header, dlt_template, dlt_category, dlt_promo_hours, dlt_consent, dlt_tm_chain, dlt_url, dlt_callback:
            the message fails India DLT (see docs/phase3-dlt.md); error explains which registration is missing or does not match.
            fw_sender, fw_content, fw_url, fw_destination, fw_destination_rate, fw_series: refused by the firewall (docs/phase3-network.md).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          description: Temporarily unavailable; nothing was charged and it is safe to retry with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sms/{id}:
    get:
      summary: Message status
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageStatus' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/wallet:
    get:
      summary: Wallet balance and credit
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    SendRequest:
      type: object
      required: [to, sender, text]
      properties:
        to: { type: string, description: 'E.164, e.g. +919812345678' }
        sender: { type: string, description: DLT-registered header }
        text: { type: string }
        pe_id: { type: string, description: DLT Principal Entity ID }
        template_id: { type: string, description: DLT template ID; detected automatically when omitted }
        tm_chain: { type: string, description: PE-TM chain value; platform default used when omitted }
        client_ref: { type: string, maxLength: 64 }
    SendResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        segments: { type: integer }
        cost: { type: string, description: 'Decimal, 4 places, INR' }
        status: { type: string, enum: [accepted] }
        duplicate: { type: boolean, description: 'true when the Idempotency-Key was seen before; id is the original message' }
    MessageStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [accepted, rejected, submitted, delivered, failed, expired] }
        error_code: { type: string, description: 'NO_ROUTE, SMPP_<status>, <STAT>:<err> from the operator, NO_DLR' }
        to: { type: string }
        sender: { type: string }
        segments: { type: integer }
        cost: { type: string }
        client_ref: { type: string }
        accepted_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    Wallet:
      type: object
      properties:
        currency: { type: string, example: INR }
        balance: { type: string, description: May be negative when credit is used }
        credit_limit: { type: string, description: Defaults to 0 }
        held: { type: string }
        available: { type: string, description: balance + credit_limit - held }
        credit_used: { type: string }
    Error:
      type: object
      properties:
        code: { type: string, description: 'invalid_json, invalid_request, invalid_destination, invalid_sender, invalid_text, insufficient_balance, reseller_billing, account_inactive, no_rate, dlt_entity, dlt_header, dlt_template, dlt_category, dlt_promo_hours, dlt_consent, dlt_tm_chain, dlt_url, dlt_callback, fw_sender, fw_content, fw_url, fw_destination, fw_destination_rate, fw_series, throttled, unauthorized, not_found, unavailable' }
        error: { type: string }
